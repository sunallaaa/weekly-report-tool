# <홈>/nginx.conf 의 server { } 안, 기존 PD 대시보드 location 블록 아래 · "location / {" 위에 추가
# 앞단(ai.adef.co.kr)이 /<계정명> 을 떼고 넘겨주므로 여기서는 /naver/ 로 받는다
# 접속 주소: https://ai.adef.co.kr/<계정명>/naver/

    location = /naver {
        return 301 /<계정명>/naver/;
    }

    location /naver/ {
        set $naver_upstream http://naver-dashboard:8080;
        rewrite ^/naver/(.*)$ /$1 break;
        proxy_pass $naver_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Email $http_x_email;   # 앞단 사내 로그인 사용자 이메일
        proxy_set_header X-User  $http_x_user;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;                  # 관리 화면 수동 수집은 몇 분 걸릴 수 있음
    }
