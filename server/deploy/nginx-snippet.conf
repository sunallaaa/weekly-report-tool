# /home/seonhwa_choi/nginx.conf 의 server { } 안, 기존 /seonhwa_choi/dashboard/ 블록 아래에 추가
# 접속 주소: https://ai.adef.co.kr/seonhwa_choi/naver/

location /seonhwa_choi/naver/ {
    proxy_pass http://seonhwa_choi-naver-dashboard:8080;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /seonhwa_choi/naver;

    proxy_read_timeout 600s;   # 관리 화면의 수동 수집은 몇 분 걸릴 수 있음
}

# 슬래시 없이 접속했을 때
location = /seonhwa_choi/naver {
    return 301 /seonhwa_choi/naver/;
}
