# nginx.conf 에 추가 — https://ai.adef.co.kr/seonhwa_choi/naver/
# 앱이 BASE_PATH(/seonhwa_choi/naver)를 인식하므로 경로를 떼고 넘기셔도, 그대로 넘기셔도 동작합니다.
location /seonhwa_choi/naver/ {
    proxy_pass http://seonhwa_choi-naver-dashboard:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;      # 관리 화면의 수동 수집·월간 작업은 수 분 걸릴 수 있음
    client_max_body_size 20m;
}
