# /home/seonhwa_choi/docker-compose.yml 의 services: 아래에 추가
# (소스 위치: /home/seonhwa_choi/naver-dashboard — 업로드 완료 상태)

  naver-dashboard:
    build: ./naver-dashboard
    container_name: ${USERNAME}-naver-dashboard
    restart: unless-stopped
    env_file:
      - ./naver-dashboard/.env
    environment:
      - TZ=Asia/Seoul
    expose:
      - "8080"
    volumes:
      - ./naver-dashboard/data:/app/data
    depends_on:
      - mariadb
