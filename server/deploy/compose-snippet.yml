# <홈>/docker-compose.yml 의 services: 아래, 맨 끝 "networks:" 줄 바로 위에 추가 (기존 서비스와 같은 들여쓰기)

  naver-dashboard:
    build: ./naver-dashboard
    container_name: ${USERNAME}-naver-dashboard
    restart: always
    env_file:
      - ./naver-dashboard/.env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./naver-dashboard/data:/app/data
    expose:
      - "8080"
    depends_on:
      - mariadb
