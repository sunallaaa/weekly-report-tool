<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 네이버 광고 대시보드</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --sub:#6b7385; --line:#e3e6ec; --acc:#03c75a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink);
         font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; font-size:14px; padding:16px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; width:100%; max-width:380px; }
  h1 { font-size:18px; margin:0 0 6px; } p { color:var(--sub); margin:0 0 18px; line-height:1.5; }
  label { display:block; font-size:12px; color:var(--sub); margin:12px 0 4px; }
  input { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; }
  button { width:100%; margin-top:16px; font:inherit; padding:10px; border:0; border-radius:8px; background:var(--acc); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .msg { margin-top:12px; font-size:13px; line-height:1.5; } .err { color:#c92a2a; } .ok { color:#2b8a3e; }
  #step2 { display:none; }
</style>
</head>
<body>
<div class="box">
  <h1>📡 네이버 광고 대시보드</h1>
  <p>등록된 이메일로 인증코드를 보내드립니다.<br>접근 권한은 담당 팀장에게 요청해 주세요.</p>
  <div id="step1">
    <label for="email">이메일</label>
    <input id="email" type="email" autocomplete="email" placeholder="name@adef.co.kr">
    <button id="send">인증코드 받기</button>
  </div>
  <div id="step2">
    <label for="code">인증코드 6자리</label>
    <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <button id="verify">로그인</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
function $(id) { return document.getElementById(id); }
function post(path, body) {
  return fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status)); return j; }); });
}
function msg(t, ok) { $('msg').className = 'msg ' + (ok ? 'ok' : 'err'); $('msg').textContent = t; }
$('send').onclick = function () {
  var b = this, e = $('email').value.trim();
  if (!e) return msg('이메일을 입력해 주세요.');
  b.disabled = true;
  post('api/auth/request', { email: e }).then(function (r) {
    msg(r.message, true); $('step1').style.display = 'none'; $('step2').style.display = 'block'; $('code').focus();
  }).catch(function (err) { msg(err.message); }).finally(function () { b.disabled = false; });
};
$('verify').onclick = function () {
  var b = this; b.disabled = true;
  post('api/auth/verify', { email: $('email').value.trim(), code: $('code').value.trim() })
    .then(function () { location.href = './'; })
    .catch(function (err) { msg(err.message); }).finally(function () { b.disabled = false; });
};
$('email').onkeydown = function (e) { if (e.key === 'Enter') $('send').click(); };
$('code').onkeydown = function (e) { if (e.key === 'Enter') $('verify').click(); };
</script>
</body>
</html>
