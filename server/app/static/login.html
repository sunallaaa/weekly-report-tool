<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 네이버 광고 대시보드</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:radial-gradient(1200px 600px at 10% -10%, #e8eefc 0, transparent 60%), radial-gradient(900px 500px at 110% 110%, #e0f4f1 0, transparent 60%), var(--bg); }
  .box { background:#fff; border:1px solid var(--line); border-radius:20px; padding:36px 32px; width:100%; max-width:400px; box-shadow:0 10px 30px rgba(16,24,40,.08); }
  .logo { width:44px; height:44px; border-radius:12px; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; margin-bottom:16px; }
  h1 { font-size:22px; font-weight:800; margin:0 0 6px; letter-spacing:-0.02em; } p { color:var(--sub); margin:0 0 20px; line-height:1.6; }
  label { display:block; font-size:12.5px; font-weight:700; color:var(--sub); margin:14px 0 6px; }
  input { width:100%; padding:12px 14px; }
  button { width:100%; margin-top:18px; font:inherit; font-weight:700; padding:12px; border:0; border-radius:12px; background:var(--acc); color:#fff; cursor:pointer; }
  button:hover { background:var(--acc-d); } button:disabled { opacity:.5; cursor:wait; }
  .msg { margin-top:14px; font-size:13px; line-height:1.5; } .err { color:var(--red); background:none; border:0; padding:0; } .ok { color:var(--green); background:none; border:0; padding:0; }
  #step2 { display:none; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">M</div>
  <h1>한국마즈 네이버 광고 대시보드</h1>
  <p>등록된 이메일로 인증코드를 보내드립니다.<br>접근 권한은 담당 팀장에게 요청해 주세요.</p>
  <div id="step1">
    <label for="email">이메일</label>
    <input id="email" type="email" autocomplete="email" placeholder="name@adef.co.kr">
    <button id="send">인증코드 받기</button>
  </div>
  <div id="step2">
    <label for="code">인증코드 6자리</label>
    <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <button id="verify">로그인</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
function $(id) { return document.getElementById(id); }
function post(path, body) {
  return fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status)); return j; }); });
}
function msg(t, ok) { $('msg').className = 'msg ' + (ok ? 'ok' : 'err'); $('msg').textContent = t; }
$('send').onclick = function () {
  var b = this, e = $('email').value.trim();
  if (!e) return msg('이메일을 입력해 주세요.');
  b.disabled = true;
  post('api/auth/request', { email: e }).then(function (r) {
    msg(r.message, true); $('step1').style.display = 'none'; $('step2').style.display = 'block'; $('code').focus();
  }).catch(function (err) { msg(err.message); }).finally(function () { b.disabled = false; });
};
$('verify').onclick = function () {
  var b = this; b.disabled = true;
  post('api/auth/verify', { email: $('email').value.trim(), code: $('code').value.trim() })
    .then(function () { location.href = './'; })
    .catch(function (err) { msg(err.message); }).finally(function () { b.disabled = false; });
};
$('email').onkeydown = function (e) { if (e.key === 'Enter') $('send').click(); };
$('code').onkeydown = function (e) { if (e.key === 'Enter') $('verify').click(); };
</script>
</body>
</html>
